name: Calendario de eventos (avisos F&B)

# Regenera eventos/eventos.ics cada vez que cambia la página de Eventos
# y además una vez al día, sin que haga falta hacer nada a mano.
on:
  push:
    branches: [main]
    paths: ["eventos/index.html", "eventos/generar_ics.py"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generar calendario
        run: python eventos/generar_ics.py
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add eventos/eventos.ics
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Calendario de eventos actualizado"
          git push
          # pedir a GitHub Pages que publique de nuevo (los push del bot no siempre lo lanzan)
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
