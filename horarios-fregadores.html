<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios Fregadores</title>
<meta name="theme-color" content="#1c1a17">
<link rel="manifest" href="fregadores.webmanifest">
<link rel="icon" href="icono-v2-192.png">
<link rel="apple-touch-icon" href="icono-v2-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fregadores">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#1c1a17;
    --card:#262220;
    --ink:#f2e9da;
    --soft:#bdb1a3;
    --faint:#a1968a;
    --line:#393330;
    --banq:#e3a63f;
    --banq-ink:#2b1c05;
    --hotel:#3f9b7f;
    --hotel-ink:#04241d;
    --palau:#8b7cd8;
    --palau-ink:#16102e;
    --hoy:#e0603b;
    --hoy-bg:#332723;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 16px 12px}
  .kicker{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
  h1{font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:1.7rem;letter-spacing:.01em;line-height:1.1;margin-top:3px}
  .updated{font-size:.72rem;color:var(--faint);margin-top:2px}

  .controls{display:flex;gap:8px;margin-top:12px}
  .search{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 10px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:.95rem;padding:9px 6px}
  .search input::placeholder{color:var(--faint)}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:0 13px;font:inherit;font-size:1.1rem;cursor:pointer}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.navbtn:focus-visible,.search input:focus-visible{outline:2px solid var(--hotel);outline-offset:2px}

  .chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:'Barlow Condensed';font-weight:600;font-size:.84rem;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .chip.on[data-z="BANQUETES"]{background:var(--banq);border-color:var(--banq);color:var(--banq-ink)}
  .chip.on[data-z="COCINA HOTEL"]{background:var(--hotel);border-color:var(--hotel);color:var(--hotel-ink)}
  .chip.on[data-z="COCINA PALAU"]{background:var(--palau);border-color:var(--palau);color:var(--palau-ink)}
  .name-chip{text-transform:none;letter-spacing:.01em;font-family:'Barlow';font-weight:500;font-size:.85rem}

  .viewtabs{display:flex;gap:6px;margin-top:10px}
  .tab{flex:1;font-family:'Barlow Condensed';font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
  .tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

  main{max-width:680px;margin:0 auto;padding:16px 12px 70px}

  /* ---------- vista lista ---------- */
  .day{margin-bottom:20px;scroll-margin-top:190px}
  .day-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .day-head h2{font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:1.2rem;letter-spacing:.01em}
  .tag-hoy{font-family:'Barlow Condensed';font-weight:600;font-size:.72rem;letter-spacing:.14em;background:var(--hoy);color:#1c1a17;border-radius:3px;padding:2px 7px;text-transform:uppercase}
  .day-count{margin-left:auto;font-size:.74rem;color:var(--faint)}

  .ticket{display:grid;grid-template-columns:3px 1fr auto;background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:7px}
  .ticket .stripe{background:var(--faint)}
  .ticket[data-z="BANQUETES"] .stripe{background:var(--banq)}
  .ticket[data-z="COCINA HOTEL"] .stripe{background:var(--hotel)}
  .ticket[data-z="COCINA PALAU"] .stripe{background:var(--palau)}
  .t-main{padding:9px 12px;min-width:0}
  .t-name{font-weight:500;font-size:.98rem;line-height:1.25}
  .t-sub{font-family:'Barlow Condensed';font-weight:500;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:1px}
  .t-time{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:9px 13px;border-left:1px solid var(--line)}
  .t-hours{font-size:1rem;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
  .t-night{font-size:.66rem;color:var(--hoy);letter-spacing:.05em;text-transform:uppercase;margin-top:1px}


  /* ---------- vista cuadrante (una fila por persona) ---------- */
  .cwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px}
  table.cua{border-collapse:separate;border-spacing:0;width:100%;min-width:780px}
  table.cua th,table.cua td{padding:6px 4px;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
  table.cua thead th{font-family:'Barlow Condensed';font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;padding-bottom:8px}
  table.cua thead th.d-hoy{color:var(--hoy)}
  table.cua tbody tr:last-child td{border-bottom:none}
  .pn{position:sticky;left:0;z-index:2;background:var(--card);min-width:118px;width:118px;font-weight:500;font-size:.88rem;line-height:1.2;padding-right:8px!important;border-right:1px solid var(--line)}
  td.col-hoy{background:var(--hoy-bg)}
  td.vacia{color:var(--faint);text-align:center!important;font-size:.9rem}
  .cel{border-left:2px solid var(--faint);background:#2f2a27;border-radius:0 4px 4px 0;padding:4px 6px;margin-bottom:4px;min-width:96px}
  .cel:last-child{margin-bottom:0}
  .cel[data-z="BANQUETES"]{border-left-color:var(--banq)}
  .cel[data-z="COCINA HOTEL"]{border-left-color:var(--hotel)}
  .cel[data-z="COCINA PALAU"]{border-left-color:var(--palau)}
  .cel-h{font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cel-t{font-family:'Barlow Condensed';font-weight:500;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:1px;line-height:1.2}
  .cel[data-z="BANQUETES"] .cel-t{color:var(--banq)}
  .cel[data-z="COCINA PALAU"] .cel-t{color:var(--palau)}
  /* ---------- vista semana ---------- */
  .week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .week-nav h2{flex:1;text-align:center;font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:1.25rem}
  .navbtn{background:var(--card);border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:6px 14px;font:inherit;font-size:1rem;cursor:pointer}
  .navbtn[disabled]{opacity:.35;cursor:default}

  .tlwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px}
  .tlinner{min-width:820px}
  .tl-axis{display:flex;gap:8px;margin-bottom:4px}
  .tl-axis .sp{flex:0 0 54px}
  .tl-axis .ax{flex:1;position:relative;height:13px;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tl-axis .ax span{position:absolute;transform:translateX(-50%)}
  .tl-axis .ax span:first-child{transform:none}

  .tl-day{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
  .tl-day:last-child{border-bottom:1px solid var(--line)}
  .tl-day.hoy{background:var(--hoy-bg);border-radius:6px}
  .tl-label{flex:0 0 54px;font-family:'Barlow Condensed';font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding-top:3px;padding-left:2px}
  .tl-day.hoy .tl-label{color:var(--hoy)}
  .tl-track{flex:1;min-width:0}
  .tl-lane{position:relative;height:20px;margin-bottom:3px}
  .tl-lane:last-child{margin-bottom:0}
  .bar{position:absolute;height:20px;border-radius:3px;font-size:10.5px;line-height:20px;padding:0 6px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums;background:#4a423d;color:var(--ink)}
  .bar[data-z="BANQUETES"]{background:var(--banq);color:var(--banq-ink)}
  .bar[data-z="COCINA HOTEL"]{background:var(--hotel);color:var(--hotel-ink)}
  .bar[data-z="COCINA PALAU"]{background:var(--palau);color:var(--palau-ink)}
  .bar .sep{opacity:.45;padding:0 1px}
  .tl-empty{font-size:.8rem;color:var(--faint);padding-top:4px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-family:'Barlow Condensed';font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .dot{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin-right:5px}

  .state{text-align:center;color:var(--soft);padding:50px 20px;font-size:.93rem;line-height:1.5}
  .state b{color:var(--ink)}
  .spinner{width:24px;height:24px;border:2.5px solid var(--line);border-top-color:var(--hotel);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

  /* ---------- fichar ---------- */
  .top{display:flex;align-items:center;gap:12px}
  .top-txt{flex:1;min-width:0}
  .fichar{flex:0 0 auto;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;font-size:1.75rem;letter-spacing:.08em;
    background:var(--hotel);color:var(--hotel-ink);border:none;border-radius:14px;padding:0 22px;min-height:66px;cursor:pointer;
    box-shadow:0 0 0 3px rgba(63,155,127,.25);display:flex;align-items:center;gap:8px}
  .fichar svg{width:26px;height:26px;flex:0 0 auto}
  .fichar.dentro{background:var(--hoy);color:#1c1a17;box-shadow:0 0 0 3px rgba(224,96,59,.3)}
  .fichar:active{transform:scale(.96)}
  .fichar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  @media (max-width:370px){.fichar{font-size:1.45rem;padding:0 15px;min-height:58px}.fichar svg{display:none}}

  .turno{margin-top:11px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hotel);border-radius:10px;padding:9px 12px}
  .turno.tarde{border-left-color:var(--hoy);background:var(--hoy-bg)}
  .turno-l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .turno-nom{font-weight:600;font-size:1rem}
  .turno-ent{font-size:.82rem;color:var(--soft)}
  .turno-cont{margin-left:auto;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .turno-l2{font-size:.86rem;color:var(--soft);margin-top:2px}
  .turno.tarde .turno-l2{color:var(--hoy);font-weight:600}
  .prog{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--hotel);border-radius:3px}
  .turno.tarde .prog i{background:var(--hoy)}

  .modal{position:fixed;inset:0;z-index:50;background:rgba(10,9,8,.86);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .mbox{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 18px 18px;text-align:center;position:relative}
  .mclose{position:absolute;top:8px;right:8px;width:44px;height:44px;background:none;border:none;color:var(--soft);font-size:1.6rem;cursor:pointer;border-radius:10px}
  .mtit{font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:1.6rem;line-height:1.15;padding:0 30px}
  .msub{font-size:.92rem;color:var(--soft);margin-top:6px;line-height:1.45}
  .gps{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--soft);margin-top:10px;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .gps .pt{width:9px;height:9px;border-radius:50%;background:var(--faint)}
  .gps.ok .pt{background:var(--hotel)}
  .gps.buscando .pt{background:var(--banq);animation:parp 1s ease-in-out infinite}
  @keyframes parp{50%{opacity:.25}}
  .dots{display:flex;justify-content:center;gap:16px;margin:20px 0 6px}
  .dots i{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--soft)}
  .dots i.f{background:var(--ink);border-color:var(--ink)}
  .dots.mal{animation:sacude .4s}
  @keyframes sacude{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .merr{min-height:1.4em;color:var(--hoy);font-weight:600;font-size:.95rem}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .pad button{height:66px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.9rem;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums}
  .pad button:active{background:var(--line)}
  .pad .k-aux{font-size:1rem;color:var(--soft)}
  .big-ok{font-family:'Barlow Condensed';font-weight:600;font-size:2.6rem;letter-spacing:.06em;margin-top:6px}
  .big-ok.ent{color:var(--hotel)}
  .big-ok.sal{color:var(--hoy)}
  .mhora{font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
  .minfo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;font-size:.95rem;line-height:1.5;text-align:left}
  .minfo.aviso{border-color:var(--banq);color:var(--banq)}
  .mbtn{display:block;width:100%;margin-top:16px;min-height:58px;border:none;border-radius:14px;background:var(--ink);color:var(--paper);font-family:'Barlow Condensed';font-weight:600;font-size:1.35rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .mbtn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:1.05rem;min-height:50px;margin-top:10px}
  .btn-av{font-size:.9rem;font-weight:600;white-space:nowrap;padding:0 11px;flex:0 0 auto}
  .search{min-width:0}
  .search input{min-width:0;width:100%}
  .btn-av.on{color:var(--hotel);border-color:var(--hotel)}
  .spin-big{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--hotel);border-radius:50%;margin:22px auto;animation:spin .8s linear infinite}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="top-txt">
      <div class="kicker">Meliá Palma Bay y Palau de Congressos de Palma</div>
      <h1>Horarios fregadores</h1>
      <div class="updated" id="updated"></div>
    </div>
    <button class="fichar" id="fichar" aria-label="Fichar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2.2"/></svg>FICHAR
    </button>
  </div>
  <div id="turno" hidden></div>
  <div class="controls">
    <div class="search"><input id="q" type="search" placeholder="Busca tu nombre…" autocomplete="off"></div>
    <button class="btn btn-av" id="avisos" title="Avisos de turno" aria-label="Activar avisos de turno"><span aria-hidden="true">&#128276;</span> <span id="avisos-t">Avisos</span></button>
    <button class="btn" id="reload" title="Actualizar" aria-label="Actualizar">&#10227;</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips" id="namechips"></div>
  <div class="viewtabs">
    <button class="tab on" id="tab-cuadrante">Cuadrante</button>
    <button class="tab" id="tab-semana">Semana</button>
    <button class="tab" id="tab-lista">Lista</button>
  </div>
</header>

<main id="app">
  <div class="state"><div class="spinner"></div>Cargando horarios…</div>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtit">
  <div class="mbox" id="mbox"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTmMytMNWbZy0Q17VSSFg70LFvkeUmkFu6lKEEYe4Qsxfj7pR8llIUKL1kJ_b5PC47zkH6g4jOCvKRC/pub?gid=678979776&single=true&output=csv";

const MESES = {enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const app = document.getElementById('app');

// activeZones: conjunto de zonas seleccionadas (vacío = todas las zonas)
let rows = [], zones = [], names = [], activeZones = new Set(), activeName = null;
let view = 'cuadrante', weekStart = null;

// Nombres de turno: solo se aplican a COCINA HOTEL
const TURNOS = {};
[['8:00','16:00','Trasluz y -1'],
 ['9:00','15:30','Level y cocina hotel'],
 ['15:30','23:30','Fregador tarde'],
 ['18:00','0:00','Apoyo fregador tarde']].forEach(function(t){ TURNOS[slotKey(t[0],t[1])] = t[2]; });

function toMin(t){
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function fmtH(t){
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? (m[1].length<2?'0':'')+m[1]+':'+m[2] : String(t).trim();
}
function slotKey(a,b){ return toMin(a)+'|'+toMin(b); }
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDia(d){ return d.toLocaleDateString('es-ES',{day:'numeric',month:'long'}); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function parseCSV(text){
  const out=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);out.push(row);row=[];cur=''; }
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);out.push(row);}
  return out;
}

function parseDate(s){
  const m = s.toLowerCase().match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)(?:\s+de\s+(\d{4}))?/);
  if(!m || !(m[2] in MESES)) return null;
  const now = new Date();
  const y = m[3] ? +m[3] : now.getFullYear();
  const d = new Date(y, MESES[m[2]], +m[1]);
  if(!m[3]){
    const diff = d - now;
    if(diff > 183*864e5) d.setFullYear(y-1);
    if(diff < -183*864e5) d.setFullYear(y+1);
  }
  return d;
}

// Nombre completo con apellido: "CHAMI, DJAHID" -> "Djahid Chami", "EVELIN HERRERA" -> "Evelin Herrera"
function fullName(n){
  let t = String(n).trim();
  const m = t.match(/^([^,(]+),\s*([^(]+)(.*)$/);
  if(m) t = m[2].trim()+' '+m[1].trim()+(m[3]?' '+m[3].trim():'');
  return t.toLowerCase().replace(/(^|[\s(-])(\p{L})/gu, function(x,a,b){ return a+b.toUpperCase(); });
}
function shortName(n){
  const s = n.split(/[,(]/)[0].trim().split(/\s+/)[0].toLowerCase();
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function turnoDe(r){
  return r.zona==='COCINA HOTEL' ? (TURNOS[slotKey(r.entrada,r.salida)] || null) : null;
}

// etiqueta que se muestra tras la barra vertical: nombre del turno en cocina hotel, zona en el resto
const ZONA_TXT = {'BANQUETES':'Banquetes','COCINA PALAU':'Cocina Palau','COCINA HOTEL':'Cocina hotel'};
function etiquetaDe(r){
  if(r.zona==='COCINA HOTEL') return TURNOS[slotKey(r.entrada,r.salida)] || 'Cocina hotel';
  return ZONA_TXT[r.zona] || r.zona.charAt(0)+r.zona.slice(1).toLowerCase();
}

function load(){
  app.innerHTML = '<div class="state"><div class="spinner"></div>Cargando horarios…</div>';
  fetch(CSV_URL + "&t=" + Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(text){
      const data = parseCSV(text);
      const hi = data.findIndex(function(r){ return r.some(function(c){ return c.trim().toUpperCase()==='FECHA'; }); });
      if(hi < 0) throw new Error('cabecera');
      rows = data.slice(hi+1)
        .filter(function(r){ return r.length>=5 && r[0].trim() && r[1].trim(); })
        .map(function(r){
          return {
            fechaTxt: r[0].trim(),
            fecha: parseDate(r[0]),
            nombre: r[1].trim(),
            zona: r[2].trim().toUpperCase(),
            entrada: r[3].trim(),
            salida: r[4].trim()
          };
        });
      zones = [...new Set(rows.map(function(r){return r.zona;}).filter(Boolean))].sort();
      names = [...new Set(rows.map(function(r){return r.nombre;}).filter(Boolean))].sort(function(a,b){ return a.localeCompare(b,'es'); });
      // si al recargar desaparece alguna zona de la hoja, se quita del filtro
      activeZones.forEach(function(z){ if(zones.indexOf(z)<0) activeZones.delete(z); });
      document.getElementById('updated').textContent =
        'Actualizado a las ' + new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      renderChips(); renderNameChips(); render();
      completarSalidaPrevista();
    })
    .catch(function(){
      app.innerHTML = '<div class="state"><b>No se han podido cargar los horarios.</b><br>Comprueba la conexión y pulsa el botón de actualizar.</div>';
    });
}

// Filtro de zonas multiselección:
// - "Todas las zonas" limpia la selección
// - cada zona se activa/desactiva de forma independiente
// - si se marcan todas, vuelve automáticamente a "Todas las zonas"
function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML='';
  const all=document.createElement('button');
  all.className='chip'+(activeZones.size===0?' on':'');
  all.setAttribute('aria-pressed', activeZones.size===0);
  all.textContent='Todas las zonas';
  all.onclick=function(){ activeZones.clear(); renderChips(); render(); };
  el.appendChild(all);
  zones.forEach(function(z){
    const on = activeZones.has(z);
    const b=document.createElement('button');
    b.className='chip'+(on?' on':'');
    b.setAttribute('aria-pressed', on);
    b.dataset.z=z; b.textContent=z.toLowerCase();
    b.onclick=function(){
      if(activeZones.has(z)) activeZones.delete(z); else activeZones.add(z);
      if(activeZones.size===zones.length) activeZones.clear();
      renderChips(); render();
    };
    el.appendChild(b);
  });
}

function renderNameChips(){
  const el = document.getElementById('namechips');
  el.innerHTML='';
  const all=document.createElement('button');
  all.className='chip name-chip'+(activeName===null?' on':'');
  all.textContent='Todo el equipo';
  all.onclick=function(){ activeName=null; renderNameChips(); render(); };
  el.appendChild(all);
  names.forEach(function(n){
    const b=document.createElement('button');
    b.className='chip name-chip'+(activeName===n?' on':'');
    b.textContent=fullName(n); b.title=n;
    b.onclick=function(){ activeName=(activeName===n?null:n); renderNameChips(); render(); };
    el.appendChild(b);
  });
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = rows.filter(function(r){
    return (activeZones.size===0 || activeZones.has(r.zona)) &&
           (!activeName || r.nombre===activeName) &&
           (!q || r.nombre.toLowerCase().includes(q));
  });
  if(view==='cuadrante') renderCuadrante(list);
  else if(view==='semana') renderSemana(list);
  else renderLista(list);
}

function renderLista(list){
  const today = new Date(); today.setHours(0,0,0,0);
  if(!list.length){
    app.innerHTML='<div class="state">Sin turnos que coincidan.<br>Prueba con otro nombre o quita el filtro de zona.</div>';
    return;
  }
  const groups=[]; const idx={};
  list.forEach(function(r){
    if(!(r.fechaTxt in idx)){ idx[r.fechaTxt]=groups.length; groups.push({txt:r.fechaTxt,date:r.fecha,items:[]}); }
    groups[idx[r.fechaTxt]].items.push(r);
  });

  app.innerHTML='';
  let todayEl=null, nextEl=null;
  groups.forEach(function(g){
    const esHoy = g.date && g.date.getTime()===today.getTime();
    const day=document.createElement('section'); day.className='day';
    day.innerHTML =
      '<div class="day-head"><h2>'+esc(g.txt)+'</h2>'+
      (esHoy?'<span class="tag-hoy">Hoy</span>':'')+
      '<span class="day-count">'+g.items.length+(g.items.length===1?' turno':' turnos')+'</span></div>';
    g.items.forEach(function(r){
      const t=document.createElement('div'); t.className='ticket'; t.dataset.z=r.zona;
      const tn = turnoDe(r);
      t.innerHTML =
        '<div class="stripe"></div>'+
        '<div class="t-main"><div class="t-name">'+esc(r.nombre)+'</div>'+
        '<div class="t-sub">'+esc(etiquetaDe(r))+'</div></div>'+
        '<div class="t-time"><div class="t-hours">'+esc(fmtH(r.entrada))+'–'+esc(fmtH(r.salida))+'</div>'+
        (cruzaMedianoche(r)?'<div class="t-night">acaba de madrugada</div>':'')+'</div>';
      day.appendChild(t);
    });
    app.appendChild(day);
    if(esHoy && !todayEl) todayEl=day;
    if(!nextEl && g.date && g.date.getTime()>today.getTime()) nextEl=day;
  });
  const target = todayEl || nextEl;
  if(target) target.scrollIntoView({block:'start'});
}

function cruzaMedianoche(r){
  const a=toMin(r.entrada), b=toMin(r.salida);
  return a!==null && b!==null && b<=a;
}
function salidaAjustada(r){
  const a=toMin(r.entrada), b=toMin(r.salida);
  if(a===null||b===null) return null;
  return b<=a ? b+1440 : b;
}

function prepararSemana(){
  const dated = rows.filter(function(r){ return r.fecha; });
  if(!dated.length) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const minW = startOfWeek(new Date(Math.min.apply(null, dated.map(function(r){return r.fecha.getTime();}))));
  const maxW = startOfWeek(new Date(Math.max.apply(null, dated.map(function(r){return r.fecha.getTime();}))));
  if(!weekStart) weekStart = startOfWeek(hoy);
  if(weekStart < minW) weekStart = new Date(minW);
  if(weekStart > maxW) weekStart = new Date(maxW);
  const fin = addDays(weekStart,6);
  const dias = []; for(let i=0;i<7;i++) dias.push(addDays(weekStart,i));
  return {minW:minW, maxW:maxW, fin:fin, dias:dias, hoy:hoy};
}

function navHTML(ctx){
  return '<div class="week-nav">'+
    '<button class="navbtn" id="w-prev"'+(weekStart<=ctx.minW?' disabled':'')+' aria-label="Semana anterior">&lsaquo;</button>'+
    '<h2>'+esc(fmtDia(weekStart))+' &ndash; '+esc(fmtDia(ctx.fin))+'</h2>'+
    '<button class="navbtn" id="w-next"'+(weekStart>=ctx.maxW?' disabled':'')+' aria-label="Semana siguiente">&rsaquo;</button>'+
    '</div>';
}

function leyendaHTML(){
  return '<div class="legend">'+
    '<span><span class="dot" style="background:var(--banq)"></span>Banquetes</span>'+
    '<span><span class="dot" style="background:var(--hotel)"></span>Cocina hotel</span>'+
    '<span><span class="dot" style="background:var(--palau)"></span>Cocina Palau</span>'+
    '</div>';
}

// ---------- vista cuadrante: una fila por persona ----------
function renderCuadrante(list){
  const ctx = prepararSemana();
  if(!ctx){ app.innerHTML='<div class="state">No hay fechas legibles en la hoja.</div>'; return; }
  const enSemana = list.filter(function(r){ return r.fecha && r.fecha>=weekStart && r.fecha<=ctx.fin; });

  let html = navHTML(ctx);
  if(!enSemana.length){
    html += '<div class="state">Sin turnos esta semana.<br>Usa las flechas para cambiar de semana o quita los filtros.</div>';
    app.innerHTML = html; enlazarNav(); return;
  }

  const personas = [...new Set(enSemana.map(function(r){return r.nombre;}))]
    .sort(function(a,b){ return a.localeCompare(b,'es'); });

  html += '<div class="cwrap"><table class="cua"><thead><tr><th class="pn">Equipo</th>';
  ctx.dias.forEach(function(d,i){
    const esHoy = d.getTime()===ctx.hoy.getTime();
    html += '<th'+(esHoy?' class="d-hoy"':'')+'>'+DIAS[i]+' '+d.getDate()+'</th>';
  });
  html += '</tr></thead><tbody>';

  personas.forEach(function(pnom){
    html += '<tr><td class="pn">'+esc(fullName(pnom))+'</td>';
    ctx.dias.forEach(function(d){
      const its = enSemana.filter(function(r){ return r.nombre===pnom && r.fecha.getTime()===d.getTime(); })
        .sort(function(a,b){ return (toMin(a.entrada)||0)-(toMin(b.entrada)||0); });
      const esHoy = d.getTime()===ctx.hoy.getTime();
      if(!its.length){
        html += '<td class="'+(esHoy?'col-hoy ':'')+'vacia">·</td>';
      }else{
        html += '<td class="'+(esHoy?'col-hoy':'')+'">'+its.map(function(r){
          return '<div class="cel" data-z="'+esc(r.zona)+'" title="'+esc(r.nombre+' · '+r.zona.toLowerCase())+'">'+
                 '<div class="cel-h">'+esc(fmtH(r.entrada))+'&ndash;'+esc(fmtH(r.salida))+'</div>'+
                 '<div class="cel-t">'+esc(etiquetaDe(r))+'</div></div>';
        }).join('')+'</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>' + leyendaHTML();

  app.innerHTML = html;
  enlazarNav();
  const wrap = app.querySelector('.cwrap');
  if(wrap){
    const i = ctx.dias.findIndex(function(d){ return d.getTime()===ctx.hoy.getTime(); });
    if(i > 2){
      const th = wrap.querySelectorAll('thead th')[i+1];
      if(th) wrap.scrollLeft = Math.max(0, th.offsetLeft - 150);
    }
  }
}

function renderSemana(list){
  const ctx = prepararSemana();
  if(!ctx){ app.innerHTML='<div class="state">No hay fechas legibles en la hoja.</div>'; return; }
  const today = ctx.hoy, dias = ctx.dias, fin = ctx.fin;
  const enSemana = list.filter(function(r){ return r.fecha && r.fecha>=weekStart && r.fecha<=fin; });

  let html = navHTML(ctx);

  if(!enSemana.length){
    html += '<div class="state">Sin turnos esta semana.<br>Usa las flechas para cambiar de semana o quita los filtros.</div>';
    app.innerHTML = html; enlazarNav(); return;
  }

  // escala horaria de la semana
  let ini = 1e9, fin2 = -1e9;
  enSemana.forEach(function(r){
    const a=toMin(r.entrada), b=salidaAjustada(r);
    if(a!==null) ini=Math.min(ini,a);
    if(b!==null) fin2=Math.max(fin2,b);
  });
  if(ini===1e9){ ini=480; fin2=1440; }
  ini = Math.floor(ini/60)*60;
  fin2 = Math.ceil(fin2/60)*60;
  if(fin2-ini < 240) fin2 = ini+240;
  const span = fin2-ini;
  const pos = function(m){ return ((m-ini)/span)*100; };
  const paso = span>900 ? 120 : 60;

  let ejes='';
  for(let h=ini; h<=fin2; h+=paso){
    const et = ((h/60)%24);
    ejes += '<span style="left:'+pos(h).toFixed(2)+'%">'+(et<10?'0':'')+et+'</span>';
  }
  const gradPaso = (paso/span*100).toFixed(3);

  html += '<div class="tlwrap"><div class="tlinner">'+
    '<div class="tl-axis"><div class="sp"></div><div class="ax">'+ejes+'</div></div>';

  dias.forEach(function(d,i){
    const esHoy = d.getTime()===today.getTime();
    const items = enSemana.filter(function(r){ return r.fecha.getTime()===d.getTime(); })
      .sort(function(a,b){ return (toMin(a.entrada)||0)-(toMin(b.entrada)||0); });

    html += '<div class="tl-day'+(esHoy?' hoy':'')+'"'+(esHoy?' data-hoy="1"':'')+'>'+
      '<div class="tl-label">'+DIAS[i]+' '+d.getDate()+'</div><div class="tl-track">';

    if(!items.length){
      html += '<div class="tl-empty">Sin turnos</div>';
    }else{
      items.forEach(function(r){
        const a=toMin(r.entrada), b=salidaAjustada(r);
        const horas = fmtH(r.entrada)+'–'+fmtH(r.salida);
        const tn = turnoDe(r);
        const tip = r.nombre+' · '+horas+' | '+etiquetaDe(r)+' · '+r.zona.toLowerCase();
        if(a===null||b===null){
          html += '<div class="tl-lane"><div class="bar" data-z="'+esc(r.zona)+'" style="left:0;width:100%" title="'+esc(tip)+'">'+esc(fullName(r.nombre))+' · '+esc(horas)+' <span class="sep">|</span> '+esc(etiquetaDe(r))+'</div></div>';
        }else{
          const l = pos(a), w = Math.max(pos(b)-pos(a), 4);
          html += '<div class="tl-lane"><div class="bar" data-z="'+esc(r.zona)+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%" title="'+esc(tip)+'">'+esc(fullName(r.nombre))+' · '+esc(horas)+' <span class="sep">|</span> '+esc(etiquetaDe(r))+'</div></div>';
        }
      });
    }
    html += '</div></div>';
  });

  html += '</div></div>' + leyendaHTML();

  app.innerHTML = html;

  // rejilla de fondo con el paso calculado
  const tracks = app.querySelectorAll('.tl-track');
  for(let i=0;i<tracks.length;i++){
    tracks[i].style.background = 'repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px '+gradPaso+'%)';
  }

  enlazarNav();
  const hoyEl = app.querySelector('.tl-day[data-hoy="1"]');
  if(hoyEl) hoyEl.scrollIntoView({block:'center'});
}

function enlazarNav(){
  const p = document.getElementById('w-prev'), n = document.getElementById('w-next');
  if(p) p.onclick = function(){ weekStart = addDays(weekStart,-7); render(); };
  if(n) n.onclick = function(){ weekStart = addDays(weekStart,7); render(); };
}

function setView(v){
  view = v;
  document.getElementById('tab-cuadrante').classList.toggle('on', v==='cuadrante');
  document.getElementById('tab-semana').classList.toggle('on', v==='semana');
  document.getElementById('tab-lista').classList.toggle('on', v==='lista');
  render();
}

// FICHAR
// El fichaje lo valida y lo guarda el script de Google (hoja "Fichajes Fregadores").
// La página solo pide el PIN y la ubicación, enseña el contador y avisa a la hora de salida.
// =====================================================================
const FICHAR_API = "https://script.google.com/macros/s/AKfycbx_u2vKeTj_BH8TZa9PQugUcXZ3Fa7sO1H9h5t4IhTGHZdTaJpxagdpDmeKse6qSTee/exec"; // URL de la aplicación web de Google Apps Script (termina en /exec)
const LS_KEY = 'fichajeFregadores';
const HORAS_MAX_TURNO = 20; // igual que en el script de Google
const modal = document.getElementById('modal'), mbox = document.getElementById('mbox');
let modoPin = 'fichar', avisoToken = null, gpsTimer = null, gpsPreciso = true, sinUbiOk = false, ubiDenegada = false;
let pin = '', pos = null, posErr = null, enviando = false, watchId = null, swReg = null, avisoTimer = null;

function leerEstado(){ try{ return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }catch(e){ return null; } }
function guardarEstado(s){ try{ if(s) localStorage.setItem(LS_KEY, JSON.stringify(s)); else localStorage.removeItem(LS_KEY); }catch(e){} }
function hhmm(d){ return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function dur(ms, conSeg){
  ms = Math.max(0, ms);
  const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  if(conSeg) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return h ? h+' h '+String(m).padStart(2,'0')+' min' : m+' min';
}

// Busca en el cuadrante el turno de esa persona que corresponde a la hora de entrada
function turnoPrevisto(nombre, entrada){
  const n = nombre.trim().toUpperCase();
  let mejor = null;
  rows.forEach(function(r){
    if(!r.fecha || r.nombre.trim().toUpperCase() !== n) return;
    const a = toMin(r.entrada), b = salidaAjustada(r);
    if(a === null || b === null) return;
    const ini = new Date(r.fecha); ini.setMinutes(a);
    const fin = new Date(r.fecha); fin.setMinutes(b);
    if(entrada >= fin) return;
    const dif = Math.abs(entrada - ini);
    if(dif > 12*3600e3) return;
    if(!mejor || dif < mejor.dif) mejor = {dif: dif, ini: ini, fin: fin};
  });
  return mejor;
}

// Si se fichó antes de que cargara el cuadrante, se busca ahora la hora de salida
function completarSalidaPrevista(){
  const est = leerEstado();
  if(!est || est.salida) return;
  const t = turnoPrevisto(est.nombre, new Date(est.entrada));
  if(t){ est.salida = t.fin.toISOString(); guardarEstado(est); actualizarTurno(); programarAviso(); }
}

// ---------- ventana ----------
function abrirModal(html){
  mbox.innerHTML = '<button class="mclose" id="mclose" aria-label="Cerrar">&times;</button>' + html;
  modal.hidden = false;
  document.getElementById('mclose').onclick = cerrarModal;
}
function cerrarModal(){ modal.hidden = true; pin = ''; enviando = false; pararGPS(); }
function boton(id, fn){ const b = document.getElementById(id); if(b) b.onclick = fn; }

function empezarFichaje(){
  if(!FICHAR_API){
    abrirModal('<div class="mtit" id="mtit">Fichaje en preparación</div><div class="msub">Muy pronto podrás fichar desde aquí.</div><button class="mbtn" id="m-ok">Vale</button>');
    boton('m-ok', cerrarModal); return;
  }
  if(!('geolocation' in navigator)){
    abrirModal('<div class="mtit" id="mtit">No se puede fichar</div><div class="msub">Este navegador no permite compartir la ubicación. Prueba con Chrome o Safari.</div><button class="mbtn" id="m-ok">Vale</button>');
    boton('m-ok', cerrarModal); return;
  }
  pedirPermisoAvisos();
  modoPin = 'fichar';
  pin = ''; enviando = false;
  pantallaPin();
  iniciarGPS();
}

function pantallaPin(error){
  let teclas = '';
  for(let n=1; n<=9; n++) teclas += '<button data-k="'+n+'">'+n+'</button>';
  teclas += '<button class="k-aux" data-k="c">Borrar</button><button data-k="0">0</button><button class="k-aux" data-k="x">Cancelar</button>';
  abrirModal(
    '<div class="mtit" id="mtit">'+(modoPin === 'avisos' ? 'Activar avisos' : 'Escribe tu PIN')+'</div>'+
    '<div class="msub">'+(modoPin === 'avisos' ? 'Escribe tu PIN de 4 cifras para saber quién eres' : 'Tu número de 4 cifras')+'</div>'+
    (modoPin === 'avisos' ? '' : '<div class="gps" id="gps"><span class="pt"></span><span id="gps-t"></span></div>')+
    '<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>'+
    '<div class="merr" id="merr" role="alert">'+(error ? esc(error) : '')+'</div>'+
    '<div class="pad" id="pad">'+teclas+'</div>'
  );
  pintarGPS(); pintarDots();
  if(error) sacudir();
  document.getElementById('pad').onclick = function(e){
    const b = e.target.closest('button'); if(!b) return;
    pulsar(b.dataset.k);
  };
}

function pulsar(k){
  if(enviando || !document.getElementById('pad')) return;
  if(k === 'x'){ cerrarModal(); return; }
  if(k === 'c') pin = pin.slice(0, -1);
  else if(pin.length < 4) pin += k;
  document.getElementById('merr').textContent = '';
  pintarDots();
  if(pin.length === 4) intentarEnviar();
}

function pintarDots(){
  const d = document.querySelectorAll('#dots i');
  for(let i=0; i<d.length; i++) d[i].classList.toggle('f', i < pin.length);
}
function sacudir(){
  const d = document.getElementById('dots'); if(!d) return;
  d.classList.remove('mal'); void d.offsetWidth; d.classList.add('mal');
  if(navigator.vibrate) navigator.vibrate(200);
}

// ---------- ubicación (obligatoria) ----------
function iniciarGPS(){
  pararGPS(); pos = null; posErr = null; sinUbiOk = false; ubiDenegada = false; gpsPreciso = true;
  vigilarGPS(true);
  // si en 12 s el móvil no encuentra la ubicación, se ficha igualmente sin ella
  // (el correo a los responsables lo indica; la persona no ve ningún aviso)
  gpsTimer = setTimeout(function(){
    if(pos) return;
    sinUbiOk = true;
    if(pin.length === 4 && modoPin === 'fichar') intentarEnviar();
  }, 12000);
}
function vigilarGPS(preciso){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  gpsPreciso = preciso;
  watchId = navigator.geolocation.watchPosition(function(p){
    pos = {lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy};
    posErr = null; pintarGPS();
    if(pin.length === 4 && modoPin === 'fichar') intentarEnviar();
  }, function(e){
    posErr = e;
    if(e.code === 1){
      // ha denegado el permiso: ficha igualmente y el correo lo indica
      pararGPS(); ubiDenegada = true; sinUbiOk = true; pintarGPS();
      if(pin.length === 4 && modoPin === 'fichar') intentarEnviar();
      return;
    }
    // el GPS preciso no responde (dentro de edificios): probamos con la ubicación aproximada
    if(gpsPreciso) vigilarGPS(false);
    pintarGPS();
  }, preciso ? {enableHighAccuracy: true, timeout: 8000, maximumAge: 60000}
             : {enableHighAccuracy: false, timeout: 15000, maximumAge: 300000});
}
function pararGPS(){
  clearTimeout(gpsTimer);
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
}


function pintarGPS(){
  const g = document.getElementById('gps'), t = document.getElementById('gps-t'); if(!g) return;
  if(pos){ g.className = 'gps ok'; t.textContent = 'Ubicación lista'; }
  else if(ubiDenegada){ g.className = 'gps'; t.textContent = 'Escribe tu PIN'; }
  else if(posErr){ g.className = 'gps buscando'; t.textContent = 'Buscando tu ubicación…'; }
  else { g.className = 'gps buscando'; t.textContent = 'Buscando tu ubicación…'; }
}

function pantallaSinUbicacion(){
  abrirModal(
    '<div class="mtit" id="mtit">Activa la ubicación</div>'+
    '<div class="msub">Para fichar es obligatorio compartir la ubicación.</div>'+
    '<div class="minfo"><b>Android:</b> toca el icono que hay a la izquierda de la dirección de la página → <b>Permisos</b> → <b>Ubicación</b> → <b>Permitir</b>.<br><br>'+
    '<b>iPhone:</b> Ajustes → Privacidad y seguridad → <b>Localización</b> → actívala y, en Safari (o Chrome), elige <b>Al usar la app</b>.<br><br>'+
    'Comprueba también que la ubicación del móvil está encendida.</div>'+
    '<button class="mbtn" id="m-re">Volver a intentar</button>'
  );
  boton('m-re', function(){ pin = ''; pantallaPin(); iniciarGPS(); });
}

// ---------- envío ----------
function intentarEnviar(){
  if(enviando || pin.length !== 4) return;
  if(modoPin === 'avisos'){ enviarAltaAvisos(); return; }
  if(!pos && !sinUbiOk){
    const m = document.getElementById('merr');
    if(m) m.textContent = 'Un momento…';
    return;
  }
  enviando = true;
  const cuerpo = JSON.stringify(pos ? {pin: pin, lat: pos.lat, lng: pos.lng, acc: pos.acc}
                                    : (ubiDenegada ? {pin: pin, ubicacionDenegada: true} : {pin: pin, sinUbicacion: true}));
  abrirModal('<div class="mtit" id="mtit">Fichando…</div><div class="spin-big"></div>');
  fetch(FICHAR_API, {method: 'POST', body: cuerpo})
    .then(function(r){ return r.json(); })
    .then(function(res){
      enviando = false;
      if(!res.ok){ pin = ''; pantallaPin(res.error || 'No se ha podido fichar.'); return; }
      pararGPS(); fichado(res);
    })
    .catch(function(){ enviando = false; pin = ''; pantallaPin('Sin conexión. Inténtalo otra vez.'); });
}

function fichado(res){
  const hora = new Date(res.hora);
  let html;
  if(res.tipo === 'ENTRADA'){
    const t = turnoPrevisto(res.nombre, hora);
    guardarEstado({nombre: res.nombre, entrada: res.hora, salida: t ? t.fin.toISOString() : null, avisado: false});
    html = '<div class="big-ok ent" id="mtit">✓ ENTRADA</div>';
    html += '<div class="mhora">'+hhmm(hora)+'</div><div class="msub" style="font-size:1.1rem;color:var(--ink)">'+esc(res.nombre)+'</div>';
    html += t
      ? '<div class="minfo">Tu salida es a las <b>'+hhmm(t.fin)+'</b>. '+(avisosOK() ? 'Te llegará un aviso a esa hora.' : 'Deja esta página abierta y te avisaré a esa hora.')+'</div>'
      : '<div class="minfo">No encuentro tu turno de hoy en el cuadrante, así que no puedo avisarte de la hora de salida.</div>';
  }else{
    const est = leerEstado();
    if(!est || est.nombre.toUpperCase() === res.nombre.toUpperCase()) guardarEstado(null);
    html = '<div class="big-ok sal" id="mtit">✓ SALIDA</div>';
    html += '<div class="mhora">'+hhmm(hora)+'</div><div class="msub" style="font-size:1.1rem;color:var(--ink)">'+esc(res.nombre)+'</div>';
    html += '<div class="minfo">Has trabajado <b>'+dur(res.minutos*60000)+'</b>. ¡Buen trabajo!</div>';
  }
  if(!res.sinUbicacion && !res.enZona) html += '<div class="minfo aviso">⚠️ Estás fuera del hotel y del Palau (a '+res.distancia+' m). El fichaje se ha guardado con un aviso.</div>';
  html += '<button class="mbtn" id="m-ok">Hecho</button>';
  abrirModal(html);
  boton('m-ok', cerrarModal);
  actualizarTurno(); programarAviso();
}

// ---------- contador ----------
function actualizarTurno(){
  const el = document.getElementById('turno'), btn = document.getElementById('fichar');
  let est = leerEstado();
  if(est && (Date.now() - new Date(est.entrada)) > HORAS_MAX_TURNO*3600e3){ guardarEstado(null); est = null; }
  if(!est){ el.hidden = true; btn.classList.remove('dentro'); return; }
  const ent = new Date(est.entrada), ahora = new Date();
  const sal = est.salida ? new Date(est.salida) : null;
  const tarde = !!sal && ahora >= sal;
  const l2 = !sal ? 'Sin hora de salida en el cuadrante'
           : tarde ? '⏰ Hora de salir: '+hhmm(sal)+'. No olvides FICHAR.'
           : 'Salida a las '+hhmm(sal)+' · faltan '+dur(sal - ahora);
  const pct = sal ? Math.min(100, Math.max(0, (ahora - ent) / (sal - ent) * 100)) : 0;
  btn.classList.add('dentro');
  el.className = 'turno' + (tarde ? ' tarde' : '');
  el.hidden = false;
  el.innerHTML =
    '<div class="turno-l1"><span class="turno-nom">'+esc(fullName(est.nombre))+'</span>'+
    '<span class="turno-ent">dentro desde las '+hhmm(ent)+'</span>'+
    '<span class="turno-cont" aria-label="Tiempo trabajado">'+dur(ahora - ent, true)+'</span></div>'+
    '<div class="turno-l2">'+esc(l2)+'</div>'+
    (sal ? '<div class="prog"><i style="width:'+pct.toFixed(1)+'%"></i></div>' : '');
}

// ---------- aviso a la hora de salida ----------
function avisosOK(){ return 'Notification' in window && Notification.permission === 'granted'; }
function pedirPermisoAvisos(){
  if('Notification' in window && Notification.permission === 'default'){
    try{ const p = Notification.requestPermission(); if(p && p.catch) p.catch(function(){}); }catch(e){}
  }
}
function programarAviso(){
  clearTimeout(avisoTimer);
  const est = leerEstado();
  if(!est || !est.salida || est.avisado) return;
  const falta = new Date(est.salida) - Date.now();
  if(falta <= 0){ lanzarAviso(); return; }
  avisoTimer = setTimeout(lanzarAviso, Math.min(falta, 2147000000));
}
function lanzarAviso(){
  const est = leerEstado();
  if(!est || !est.salida || est.avisado) return;
  if(Date.now() < new Date(est.salida) - 1000){ programarAviso(); return; }
  est.avisado = true; guardarEstado(est);
  const txt = 'Son las '+hhmm(new Date(est.salida))+'. Es tu hora de salida: no olvides FICHAR.';
  if(avisosOK()){
    const titulo = 'Hora de salir, '+shortName(est.nombre);
    const op = {body: txt, tag: 'salida-fregadores', requireInteraction: true, vibrate: [300,150,300,150,300], icon: 'icono-v2-192.png', badge: 'icono-v2-192.png'};
    if(swReg) swReg.showNotification(titulo, op).catch(function(){});
    else { try{ new Notification(titulo, op); }catch(e){} }
  }
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
  if(modal.hidden){
    abrirModal('<div class="mtit" id="mtit">⏰ Hora de salir</div><div class="msub" style="font-size:1.05rem;color:var(--ink)">'+esc(txt)+'</div>'+
               '<button class="mbtn" id="m-fichar">Fichar ahora</button><button class="mbtn sec" id="m-luego">Más tarde</button>');
    boton('m-fichar', empezarFichaje);
    boton('m-luego', cerrarModal);
  }
}

function esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function instalada(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

function pintarBotonAvisos(){
  const a = avisosGuardados(), b = document.getElementById('avisos'), t = document.getElementById('avisos-t');

function infoModal(titulo, html){
  abrirModal('<div class="mtit" id="mtit">'+titulo+'</div><div class="minfo">'+html+'</div><button class="mbtn" id="m-ok">Vale</button>');
  boton('m-ok', cerrarModal);
}

async function activarAvisos(){
  const a = avisosGuardados();
  if(a && 'Notification' in window && Notification.permission === 'granted'){
    abrirModal('<div class="mtit" id="mtit">🔔 Avisos activados</div>'+
      '<div class="minfo">Este móvil recibe los avisos de turno de <b>'+esc(fullName(a.nombre))+'</b>. ¡Gracias por activarlos! 🙌🏽</div>'+
      '<button class="mbtn" id="m-ok">Vale</button><button class="mbtn sec" id="m-re">Activar para otra persona</button>');
    boton('m-ok', cerrarModal);
    boton('m-re', function(){ try{ localStorage.removeItem(LS_AVISOS); }catch(e){} activarAvisos(); });
    return;
  }
  if(!FICHAR_API || !FIREBASE_CONFIG){ infoModal('Avisos en preparación', 'Muy pronto podrás activar los avisos de turno desde aquí.'); return; }
  if(esIOS() && !instalada()){
    infoModal('Primero instala la app', 'En iPhone los avisos solo funcionan si la página está en la pantalla de inicio:<br><br>'+
      '1. Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha).<br>2. Elige <b>Añadir a pantalla de inicio</b>.<br>'+
      '3. Abre la app desde el icono nuevo y vuelve a pulsar <b>🔔 Avisos</b>.');
    return;
  }
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    infoModal('No es posible en este navegador', 'Prueba a abrir la página con <b>Chrome</b> (Android) o desde el icono de la pantalla de inicio (iPhone).');
    return;
  }
  let perm = Notification.permission;
  if(perm === 'default') perm = await Notification.requestPermission();
  if(perm !== 'granted'){
    infoModal('Notificaciones bloqueadas', 'Para recibir los avisos tienes que permitir las notificaciones.<br><br>'+
      '<b>Android:</b> toca el icono a la izquierda de la dirección → <b>Permisos</b> → <b>Notificaciones</b> → <b>Permitir</b>.<br><br>'+
      '<b>iPhone:</b> Ajustes → <b>Notificaciones</b> → busca la app → <b>Permitir notificaciones</b>.');
    return;
  }
  abrirModal('<div class="mtit" id="mtit">Preparando avisos…</div><div class="spin-big"></div>');
  try{
    const reg = await navigator.serviceWorker.ready;
    const app = await import('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-app.js');
    const msg = await import('https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-messaging.js');
    const fb = app.getApps().length ? app.getApp() : app.initializeApp(FIREBASE_CONFIG);
    avisoToken = await msg.getToken(msg.getMessaging(fb), {vapidKey: FIREBASE_VAPID, serviceWorkerRegistration: reg});
    if(!avisoToken) throw new Error('sin token');
  }catch(e){
    console.error(e);
    infoModal('No se han podido activar', 'Ha habido un problema al preparar los avisos en este móvil. Inténtalo otra vez en un momento.');
    return;
  }
  modoPin = 'avisos'; pin = ''; enviando = false;
  pantallaPin();
}

function enviarAltaAvisos(){
  enviando = true;
  abrirModal('<div class="mtit" id="mtit">Activando…</div><div class="spin-big"></div>');
  fetch(FICHAR_API, {method: 'POST', body: JSON.stringify({accion: 'avisos', pin: pin, token: avisoToken, dispositivo: navigator.userAgent})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      enviando = false;
      if(!res.ok){ pin = ''; pantallaPin(res.error || 'No se ha podido activar.'); return; }
      try{ localStorage.setItem(LS_AVISOS, JSON.stringify({nombre: res.nombre, hora: res.hora})); }catch(e){}
      pintarBotonAvisos();
      abrirModal('<div class="big-ok ent" id="mtit">✓ AVISOS</div>'+
        '<div class="msub" style="font-size:1.1rem;color:var(--ink)">'+esc(fullName(res.nombre))+'</div>'+
        '<div class="minfo">¡Gracias, '+esc(fullName(res.nombre).split(' ')[0])+'! 🙌🏽 Ya tienes los avisos activados. Te avisaremos de tus turnos para que siempre sepas cuándo y dónde te toca.</div>'+
        '<button class="mbtn" id="m-ok">Hecho</button>');
      boton('m-ok', cerrarModal);
    })
    .catch(function(){ enviando = false; pin = ''; pantallaPin('Sin conexión. Inténtalo otra vez.'); });
}

document.getElementById('avisos').addEventListener('click', activarAvisos);

document.addEventListener('keydown', function(e){
  if(modal.hidden) return;
  if(e.key === 'Escape') cerrarModal();
  else if(/^[0-9]$/.test(e.key)) pulsar(e.key);
  else if(e.key === 'Backspace') pulsar('c');
});
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ actualizarTurno(); programarAviso(); } });
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw-fregadores.js').catch(function(){});
  navigator.serviceWorker.ready.then(function(r){ swReg = r; });
}
