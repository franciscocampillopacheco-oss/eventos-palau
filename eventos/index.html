<style>
/* Layout: cabecera con KPIs + gráficos (pax por día, servicios por tipo), filtros fijos (servicio, público, grupo) y vista Por día (timeline + tarjetas) o Por tipo */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#0E2233; --muted:#5A6C7B; --line:#D9E1E7; --sea:#1C5D8C; --on-blk:#FFFFFF;
  --t-des:#6B7F2A; --t-cafe:#8A5A3B; --t-cb:#D08A12; --t-alm:#1F8A7A; --t-cena:#4B4FB8; --t-coctel:#B8407A; --t-bar:#C2412D; --t-fruta:#4E9A2F; --t-beb:#3A86B8; --t-otro:#6A6F78; --t-reu:#5B6B8C; --t-mont:#8A8170; --t-expo:#7B5AA6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1620; --surface:#122230; --ink:#E6EEF4; --muted:#93A6B5; --line:#24384A; --sea:#6FB2E2; --on-blk:#0B1620;
  --t-des:#B5CC5E; --t-cafe:#C49373; --t-cb:#F0B347; --t-alm:#4CC2AF; --t-cena:#8F93F0; --t-coctel:#E57AAE; --t-bar:#F07560; --t-fruta:#86CC66; --t-beb:#6DB6E4; --t-otro:#A9AFB8; --t-reu:#9AAACB; --t-mont:#C2B8A3; --t-expo:#B597E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1620; --surface:#122230; --ink:#E6EEF4; --muted:#93A6B5; --line:#24384A; --sea:#6FB2E2; --on-blk:#0B1620;
  --t-des:#B5CC5E; --t-cafe:#C49373; --t-cb:#F0B347; --t-alm:#4CC2AF; --t-cena:#8F93F0; --t-coctel:#E57AAE; --t-bar:#F07560; --t-fruta:#86CC66; --t-beb:#6DB6E4; --t-otro:#A9AFB8; --t-reu:#9AAACB; --t-mont:#C2B8A3; --t-expo:#B597E0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
header{display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,60px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}

.evfilter{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:4px}
.evfilter .chip{font-size:14px;padding:7px 14px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.paxchart{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:96px 1fr 64px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}

.prow .num{font-family:var(--f-mono);font-size:14px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.typebars{display:grid;gap:9px}
.trow{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.trow .bar{height:14px;border-radius:4px}
.trow .num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.trow small.aud{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.note{font-size:12px;color:var(--muted);margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;gap:14px;padding-block:8px 12px;border-bottom:1px solid var(--line)}
.top header{gap:6px}
.top.compact{gap:8px;padding-block:6px 8px;box-shadow:0 6px 14px -10px rgba(0,0,0,.35)}
.top.compact .eyebrow{display:none}
.top.compact header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.top.compact h1{font-size:26px}
.top.compact .evfilter{margin-top:0}
#chipsG .chip[aria-pressed="true"],#chipsR .chip[aria-pressed="true"],#chipsD .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}

.fbsw{flex:none;gap:4px}
.fbsw .chip{font-size:13px;padding:4px 10px}
.fbsw .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.fbsw .chip[aria-pressed="false"]{opacity:1;text-decoration:line-through;color:var(--muted)}
#chipsG .chip[aria-pressed="false"],#chipsR .chip[aria-pressed="false"],#chipsD .chip[aria-pressed="false"]{opacity:1}
.evfilter .chips{flex:1 1 auto;min-width:0}
.evfilter > .flabel{min-width:118px}
.top.compact header{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:6px;align-items:center}
.top.compact .titlerow{grid-row:1 / span 3}
.top.compact header > .evfilter{grid-column:2}
.top.compact .evfilter .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:3px}
.top.compact .evfilter .chip{flex:none}
.top.compact .evfilter > .flabel{display:inline-block;min-width:44px;font-size:10px}
.top.compact .evfilter{display:flex;flex-wrap:nowrap}
@media (max-width:820px){.top.compact header{grid-template-columns:1fr}.top.compact .titlerow{grid-row:auto}.top.compact header > .evfilter{grid-column:auto}.top.compact .evfilter .search{display:none}.top.compact .evfilter > .flabel{display:none}.top.compact .evfilter .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.top.compact .evfilter .chip{flex:none}}
.top.compact .kpi{padding:5px 12px;display:flex;align-items:baseline;gap:8px}
.top.compact .kpi b{font-size:18px}
.top.compact .kpi small{font-size:12px}
.top.compact .evfilter{flex:1 1 300px;min-width:0}
.top.compact .evfilter .search{width:170px;padding:4px 8px}
.top.compact .evfilter .chip{font-size:13px;padding:4px 10px}
@media (max-width:820px){
  .top.compact .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .top.compact .kpi{padding:4px 6px;display:block;text-align:center}
  .top.compact .kpi b{font-size:15px}
  .top.compact .kpi small{font-size:10px;display:block;line-height:1.2}
  .top.compact h1{font-size:20px}
  .top.compact .evfilter .search{width:110px}
}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,0px));background:var(--bg);padding-block:10px;z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:grid;gap:6px;min-width:0;flex:1 1 520px}
.frow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.flabel{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="false"]{opacity:.45}
#reset{font-weight:600}
.search{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:min(240px,100%)}
button:focus-visible,.search:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.day{display:grid;gap:14px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.dayhead h2{font-size:28px}
.dayhead h2::first-letter{text-transform:uppercase}
.dayhead .meta{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tlin{min-width:760px;position:relative;padding:28px 12px 10px 170px}
.hours{position:absolute;top:6px;left:170px;right:12px;height:100%;pointer-events:none}
.hours span{position:absolute;top:0;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateX(-50%)}
.hours i{position:absolute;top:20px;bottom:10px;width:1px;background:var(--line)}
.lane{position:relative;height:30px;margin-bottom:6px}
.lane .ln{position:absolute;left:-158px;width:150px;top:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.blk{position:absolute;top:2px;height:26px;border-radius:5px;color:var(--on-blk);font-size:11.5px;font-weight:600;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.blk.perm{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.ctop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-weight:500}
.grp{font-size:12px;font-weight:600;color:var(--sea);margin-top:2px}
.card h3{margin:2px 0 0;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.2}
.pax{text-align:right;flex:none}
.pax b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.pax small{display:block;font-size:11px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:12px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--ink);padding:2px 8px;border-radius:5px}
.facts .beolink{font:inherit;cursor:pointer;background:none;font-size:12px;font-weight:600;color:var(--sea);border:1px solid color-mix(in srgb,var(--sea) 45%,transparent);padding:1px 8px;border-radius:5px;text-decoration:none}
.facts .beolink:hover{background:color-mix(in srgb,var(--sea) 12%,transparent)}
.alert{font-size:13px;border:1px dashed var(--c);border-radius:6px;padding:6px 9px}
details{font-size:13.5px}
summary{cursor:pointer;color:var(--sea);font-weight:600}
details ul{margin:6px 0 0;padding-left:18px;color:var(--ink)}
details li{margin:1px 0}
details h4{margin:8px 0 0;font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.group{display:grid;gap:12px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ghead .dot{width:14px;height:14px}
.ghead .meta{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.when{display:inline-block;margin-top:5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 8px;border-radius:5px}
.bar-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.bar-table td{padding:2px 0;border-bottom:1px solid var(--line)}
.bar-table td:last-child{text-align:right;font-family:var(--f-mono)}
#view{display:grid;gap:40px}
.card.nofb{border-left-style:dashed;background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.card.nofb h3{font-size:16px}
.nofbtag{font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.blk.nofb{opacity:.6;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 4px,transparent 4px 8px)}
@media (max-width:820px){.controls{position:static}.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.prow{grid-template-columns:76px 1fr 52px}.trow{grid-template-columns:110px 1fr 40px}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.ptrack i,.trow .bar{transition:width .4s ease}}
@media (max-width:820px){.top.compact .evfilter > .flabel{display:none}}
.pdfov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(3px);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pdfbar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.pdfbar b{font-family:var(--f-display);font-size:18px}
.pdfbar .chip{margin-left:auto;font-weight:600}
.pdfpages{flex:1;overflow:auto;display:grid;justify-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pdfpages canvas{width:min(900px,100%);height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);border-radius:4px}
</style>

<div class="wrap">
  <div class="top compact" id="top">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <div class="titlerow"><h1 id="h1"></h1><div class="chips fbsw" id="chipsF" role="group" aria-label="Mostrar servicios con o sin F&amp;B"><button class="chip" data-k="fb" aria-pressed="true">🍽 Con F&amp;B</button><button class="chip" data-k="nofb" aria-pressed="true">📋 Sin F&amp;B</button></div></div>
    <div class="evfilter"><span class="flabel">Grupo</span><input class="search" id="q" type="search" placeholder="Buscar evento…" aria-label="Buscar evento por nombre"><div class="chips" id="chipsG"></div></div>
    <div class="evfilter"><span class="flabel">Sala</span><div class="chips" id="chipsR"></div></div>
    <div class="evfilter"><span class="flabel">Día</span><div class="chips" id="chipsD"></div></div>
  </header>

  <section class="kpis" id="kpis"></section>
  </div>

  <section class="two">
    <div class="panel">
      <h2>Pax por día</h2>
      <div class="paxchart" id="paxchart"></div>
      <div class="legend" id="legend1"></div>
      <p class="note">Barra = servicio con F&amp;B de mayor volumen del día. La cifra es el pico de pax previstos.</p>
    </div>
    <div class="panel">
      <h2>Servicios por tipo</h2>
      <div class="typebars" id="typebars"></div>
      <p class="note">Número de servicios con los filtros actuales.</p>
    </div>
  </section>

  <div class="controls">
    <div class="seg" role="group" aria-label="Vista">
      <button id="v-day" aria-pressed="true">Por día</button>
      <button id="v-type" aria-pressed="false">Por tipo</button>
    </div>
    <div class="filters">
      <div class="frow"><span class="flabel">Servicio</span><div class="chips" id="chips"></div></div>
      <div class="frow"><span class="flabel">Para quién</span><div class="chips" id="chipsA"></div></div>
      <div class="frow"><span class="flabel" id="count"></span><button class="chip" id="reset">Quitar filtros</button><span class="note">Doble clic en un filtro para ver solo ese.</span></div>
    </div>
  </div>

  <main id="view"></main>
</div>
<div class="pdfov" id="pdfov" hidden role="dialog" aria-modal="true" aria-labelledby="pdft">
  <div class="pdfbar"><b id="pdft">BEO</b><span class="note" id="pdfinfo"></span><button type="button" class="chip" id="pdfx">✕ Cerrar</button></div>
  <div class="pdfpages" id="pdfpages"></div>

  box.addEventListener("dblclick",e=>{const b=e.target.closest(".chip");if(!b)return;set.clear();set.add(b.dataset.k);
    box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===b.dataset.k));render();});
}

const fmtH=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return String(hh%24).padStart(2,"0")+":"+String(mm).padStart(2,"0")};
const isPax=s=>typeof s.pax==="number"&&!s.paxUnit&&isFb(s);
function paxBlock(s){

function card(s,showDay){

  const prices=s.prices?`<table class="bar-table">${s.prices.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table>`:"";
  return `<article class="card${isFb(s)?"":" nofb"}" style="--c:${col(s.t)}">
    <div class="ctop"><div><div class="tag">${tn(s.t)} · ${esc(AUD[s.a].n)}</div>${showDay?`<div class="when">📅 ${d.short} · 🕒 ${esc(s.time)}</div>`:""}${multiG?`<div class="grp">${esc(GRP[s.g])}</div>`:""}<h3>${esc(s.title)}</h3>${isFb(s)?"":`<span class="nofbtag">Sin F&amp;B</span>`}</div>${paxBlock(s)}</div>
    <div class="facts">${showDay?"":`<span>🕒 ${esc(s.time)}</span>`}<span>📍 ${esc(s.place)}</span>${(s.facts||[]).map((f,i)=>`<span>${esc(f)}</span>`+(i===0?beoLink(s):"")).join("")}${(s.facts||[]).length?"":beoLink(s)}${s.durEst?`<span>Duración estimada</span>`:""}</div>
    ${s.alert?`<div class="alert">${esc(s.alert)}</div>`:""}

function timeline(list){

  let hours="";for(let h=H0;h<=H1;h++){hours+=`<i style="left:${pct(h)}%"></i>`;if((h-H0)%2===0||h===H1)hours+=`<span style="left:${pct(h)}%">${String(h%24).padStart(2,"0")}h</span>`;}
  const lanes=list.slice().sort((a,b)=>a.start-b.start).map(s=>{
    const l=pct(s.start),w=Math.max(pct(s.end)-l,0.8);
    const lab=s.pax!=null?`${s.pax}${s.paxUnit?"/h":""}`:(s.paxLabel||"");
    const name=(multiG?GRP[s.g]+" · ":"")+s.title;
    return `<div class="lane"><span class="ln" title="${esc(name)}">${esc(name)}</span><div class="blk ${s.perm?"perm":""} ${isFb(s)?"":"nofb"}" style="left:${l}%;width:${w}%;background:${col(s.t)}" title="${esc(name)} · ${esc(s.time)}">${esc(lab)} · ${esc(s.time)}</div></div>`}).join("");
  return `<div class="tl"><div class="tlin"><div class="hours">${hours}</div>${lanes}</div></div>`;
}
function header(list){
  const days=activeD.size?DAYS.filter(d=>activeD.has(d.id)):DAYS;
  const peak=Math.max(0,...list.filter(isPax).map(s=>s.pax));
  const grupos=new Set(list.map(s=>s.g)).size;
  document.getElementById("kpis").innerHTML=[[DAYS.filter(d=>list.some(s=>s.fecha===d.id)).length,"días de servicio"],[list.length,"servicios"],[peak.toLocaleString("es-ES"),"pax pico F&B"],[grupos,grupos===1?"grupo":"grupos"]]
    .map(([b,s])=>`<div class="kpi"><b>${b}</b><small>${s}</small></div>`).join("");
  const used=new Set();
  document.getElementById("paxchart").innerHTML=days.map(d=>{
    const all=list.filter(s=>s.fecha===d.id), ss=all.filter(isPax);
    if(!ss.length) return `<div class="prow"><div class="lbl">${d.short}<small>${all.length} servicio${all.length===1?"":"s"}</small></div><div class="ptrack"></div><div class="num">—</div></div>`;
    const top=ss.reduce((a,b)=>b.pax>a.pax?b:a);used.add(top.t);
    return `<div class="prow"><div class="lbl">${d.short}<small>${all.length} servicio${all.length===1?"":"s"}</small></div>
    <div class="ptrack" title="${esc((multiG?GRP[top.g]+" · ":"")+top.title)}"><i style="width:${Math.max(top.pax/peak*100,1.5)}%;background:${col(top.t)}"></i></div>
    <div class="num">${top.pax}</div></div>`}).join("");
  document.getElementById("legend1").innerHTML=[...used].map(t=>`<span><i class="dot" style="background:${col(t)}"></i>${tn(t)}</span>`).join("");
  const counts=[];Object.keys(TYPES).forEach(t=>Object.keys(AUD).forEach(a=>{if(S.some(s=>s.t===t&&s.a===a))counts.push([t,a,list.filter(s=>s.t===t&&s.a===a).length,S.filter(s=>s.t===t&&s.a===a).length])}));
  counts.sort((x,y)=>y[2]-x[2]||y[3]-x[3]);const maxc=Math.max(1,...counts.map(c=>c[2]));
  document.getElementById("typebars").innerHTML=counts.filter(c=>c[2]>0).map(([t,a,n])=>`<div class="trow"><span>${tn(t)}<small class="aud">${esc(AUD[a].n)}</small></span><div><div class="bar" style="width:${n/maxc*100}%;background:${col(t)}"></div></div><span class="num">${n}</span></div>`).join("")||`<p class="note">Sin servicios con estos filtros.</p>`;
}
function render(){
  document.getElementById("v-day").setAttribute("aria-pressed",view==="day");
  document.getElementById("v-type").setAttribute("aria-pressed",view==="type");
  const list=S.filter(s=>(!activeD.size||activeD.has(s.fecha))&&(!activeR.size||salasOf(s).some(r=>activeR.has(r)))&&activeF.has(isFb(s)?"fb":"nofb")&&active.has(s.t)&&activeA.has(s.a)&&(!activeG.size||activeG.has(s.g))&&(!q||norm(GRP[s.g]).includes(q)));
  document.getElementById("count").textContent=`${list.length} de ${S.length} servicios`;
  header(list);
  const two=document.querySelector(".two");if(!two.dataset.h){two.dataset.h=two.offsetHeight;two.style.minHeight=two.offsetHeight+"px";}
  const el=document.getElementById("view");
  const byPax=(a,b)=>(b.pax||0)-(a.pax||0)||a.start-b.start;
  const empty=`<p class="note">Ningún servicio coincide con los filtros.</p>`;
  if(view==="day"){
    el.innerHTML=DAYS.map(d=>{const ss=list.filter(s=>s.fecha===d.id);if(!ss.length)return"";
      const pk=Math.max(0,...ss.filter(isPax).map(s=>s.pax));
      return `<section class="day" id="d${d.id}"><div class="dayhead"><h2>${d.name}</h2><span class="meta">${ss.length} servicio${ss.length===1?"":"s"} · pico ${pk} pax</span></div>
      ${timeline(ss)}<div class="cards">${ss.slice().sort((x,y)=>x.start-y.start||x.end-y.end||(y.pax||0)-(x.pax||0)).map(s=>card(s,false)).join("")}</div></section>`}).join("")||empty;
  }else{
    const groups=[];Object.keys(TYPES).forEach(t=>Object.keys(AUD).forEach(a=>groups.push([t,a])));
    el.innerHTML=groups.map(([t,a])=>{const ss=list.filter(s=>s.t===t&&s.a===a).sort((x,y)=>x.fecha.localeCompare(y.fecha)||x.start-y.start);if(!ss.length)return"";
      return `<section class="group"><div class="ghead"><i class="dot" style="background:${col(t)}"></i><h2>${tn(t)} · ${esc(AUD[a].n)}</h2><span class="meta">${ss.length} servicio${ss.length===1?"":"s"}</span></div><div class="cards">${ss.map(s=>card(s,true)).join("")}</div></section>`}).join("")||empty;
  }
}
render();
(function(){
  const ov=document.getElementById("pdfov"),pages=document.getElementById("pdfpages"),info=document.getElementById("pdfinfo");
  let tok=0;
  function close(){ov.hidden=true;pages.innerHTML="";tok++;document.body.style.overflow="";}
  document.getElementById("pdfx").onclick=close;
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden)close();});
  document.addEventListener("click",async e=>{
    const b=e.target.closest(".beolink");if(!b)return;
    const my=++tok;ov.hidden=false;document.body.style.overflow="hidden";pages.innerHTML="";
    document.getElementById("pdft").textContent="BEO · "+b.dataset.t;info.textContent="Cargando…";
    try{
      if(!window.pdfjsLib)throw new Error("visor");
      const r=await fetch(b.dataset.pdf);if(!r.ok)throw new Error("http "+r.status);
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(await r.arrayBuffer())}).promise;
      info.textContent=doc.numPages+" página"+(doc.numPages===1?"":"s");
      for(let i=1;i<=doc.numPages;i++){
        if(my!==tok)return;
        const pg=await doc.getPage(i),vp=pg.getViewport({scale:2});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;pages.appendChild(c);
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      }
    }catch(err){info.textContent="";pages.innerHTML=`<p class="note">No se ha podido abrir el BEO (${esc(err.message)}). Vuelve a intentarlo en unos segundos.</p>`;}
  });
})();

  const setH=()=>document.documentElement.style.setProperty("--toph",top.offsetHeight+"px");
    if(window.ResizeObserver)new ResizeObserver(setH).observe(top);setH();})();
