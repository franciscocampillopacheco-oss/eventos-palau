<style>
:root{--ink:#1C2326;--mut:#5A6569;--bg:#F4F3EF;--card:#FFFFFF;--line:#DEDBD3;--red:#B3261E;--redbg:#FBE4E2;--blue:#1859A8;--bluebg:#E3EDF9;--yel:#E0A800;--yelbg:#FFF4CC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
header small{display:block;color:var(--mut);font-size:12.5px;font-weight:500}
.home{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:none;align-items:center;justify-content:center;font-size:18px;flex:none}
body.res .home,body.list .home{display:flex}
.cam{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:20px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-size:20px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cam svg{width:30px;height:30px}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:8px 0 18px}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
h2{font-size:15px;margin:22px 0 10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:650;line-height:1.15;text-align:center;min-height:96px;justify-content:center}
.tile .e{font-size:30px;line-height:1}
.tile.chem{grid-column:span 3;flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 16px;min-height:0;font-size:15px;text-align:left}
.tile.chem small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:2px}
.plist{display:flex;flex-direction:column;gap:8px}
.prod{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.prod img,.prod .ph{width:56px;height:56px;border-radius:10px;object-fit:contain;background:#fff;flex:none;border:1px solid #EEE}
.prod .ph{display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--bg)}
.prod b{display:block;font-size:14.5px;line-height:1.2}
.prod small{color:var(--mut);font-size:12px}
.prod .n{margin-left:auto;flex:none;min-width:32px;height:32px;border-radius:16px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 8px}
.zone{font-size:12.5px;color:var(--mut);font-weight:700;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.view{display:none}.view.on{display:block}
/* resultado */
.big{border-radius:18px;padding:18px;color:#fff;display:flex;gap:16px;align-items:center}
.big .num{font-size:54px;font-weight:900;line-height:1;min-width:72px;height:72px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0 10px}
.big .t1{font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.big .t2{font-size:22px;font-weight:850;line-height:1.1;margin:3px 0}
.big .t3{font-size:13px;opacity:.92}
.what{margin:12px 0 0;color:var(--mut);font-size:14px}
.what b{color:var(--ink)}
.tip{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.warn{background:#FFF0EE;border-color:#F3C2BC;color:#8E1D17}
.mapc{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.mapc svg{display:block;width:100%;height:auto}
.maphead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin:2px 4px 6px}
.lnk{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:4px}
.again{margin-top:16px;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:16px}
.amar{background:var(--yelbg);border:1px solid #F0D27A;border-radius:18px;padding:18px}
.amar .t2{font-size:22px;font-weight:850}
/* reconocimiento */
.overlay{position:fixed;inset:0;background:rgba(20,24,26,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:24px}
.overlay.on{display:flex}
.ov{background:var(--card);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
.ov img{max-width:100%;max-height:200px;border-radius:12px;margin-bottom:12px}
.bar{height:8px;border-radius:4px;background:#EEE;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.cands h3{font-size:18px;margin:4px 0 10px}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
</style>
</head>

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;var d=[],i,j;for(i=0;i<=a.length;i++)d[i]=[i];for(j=0;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length];}
function hit(kw,toks,prefix){
 for(var i=0;i<toks.length;i++){var t=toks[i];
  if(t==kw)return 1;
  if(prefix&&t.length>=2&&kw.indexOf(t)==0)return .8;
  if(kw.length>=4&&t.length>=4&&(t.indexOf(kw)==0||kw.indexOf(t)==0&&t.length>=kw.length-1))return .9;
  if(!prefix&&kw.length>=5&&lev(t,kw)<=(kw.length>=8?2:1))return .7;
 }return 0;}

function rank(text,prefix){

 var out=[];
 CANDS.forEach(function(cd){var s=0,m=0;cd.kws.forEach(function(k){var h=hit(k,toks,prefix);if(h){s+=h*(k.length<=3&&!/\d/.test(k)?.6:1);m++;}});

var worker=null;
async function getWorker(prog){
 if(worker)return worker;
 var abs=function(p){return new URL(p,location.href).href};var src='var _f=self.fetch;self.fetch=function(u,o){u=String(u);if(u.indexOf("spa.traineddata")>=0){return _f("'+abs('lang/spa.traineddata.gz.txt')+'").then(function(r){return r.text()}).then(function(t){var b=atob(t.trim()),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Response(a)})}return _f(u,o)};importScripts("'+abs('vendor/worker.min.js')+'");';var wurl=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));worker=await Tesseract.createWorker('spa',1,{workerPath:wurl,workerBlobURL:false,corePath:abs('vendor/core'),langPath:abs('lang'),gzip:true,logger:function(m){if(m.status=='recognizing text')prog(.35+.65*m.progress);else if(m.progress!=null)prog(.35*m.progress);}});
 return worker;}
function prep(file){return new Promise(function(ok,ko){var img=new Image();img.onload=function(){var M=1600,sc=Math.min(1,M/Math.max(img.width,img.height)),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
 var cv=document.createElement('canvas');cv.width=w;cv.height=h;var x=cv.getContext('2d');x.drawImage(img,0,0,w,h);var col=document.createElement('canvas');col.width=w;col.height=h;col.getContext('2d').drawImage(img,0,0,w,h);
 var d=x.getImageData(0,0,w,h),a=d.data,mn=255,mx=0,i,g;for(i=0;i<a.length;i+=4){g=.299*a[i]+.587*a[i+1]+.114*a[i+2];a[i]=g;if(g<mn)mn=g;if(g>mx)mx=g;}
 var r=255/Math.max(1,mx-mn);for(i=0;i<a.length;i+=4){g=(a[i]-mn)*r;a[i]=a[i+1]=a[i+2]=g;}x.putImageData(d,0,0);ok({cv:cv,color:col,url:img.src});};img.onerror=ko;img.src=URL.createObjectURL(file);});}
function rot(cv){var c=document.createElement('canvas');c.width=cv.height;c.height=cv.width;var x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(cv,0,0);return c;}

 try{var pr=await prep(f);$('ovImg').src=pr.url;
  var pObj=detectObj(pr.color);
  var w=await getWorker(function(p){bar.style.width=Math.round(p*100)+'%'});
  var r=await w.recognize(pr.cv);txt=r.data.text;
  if(rank(txt).length==0||words(txt).filter(function(t){return t.length>=4}).length<3){$('ovTxt').textContent='Probando girada…';var r2=await w.recognize(rot(pr.cv));txt+=' '+r2.data.text;}

 location.hash='cand';}
